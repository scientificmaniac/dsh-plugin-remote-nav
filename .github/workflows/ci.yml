name: 测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 构建与测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建
        run: npm run build

      - name: 运行测试
        run: npm test
